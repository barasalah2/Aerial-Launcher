name: Release
on:
  push:
    tags:
      - 'v*'
  # Lets a release be rebuilt from the Actions tab without moving its tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Create release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Publishing
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
